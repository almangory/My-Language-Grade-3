<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for Gradients and Filters -->
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#24384a" />
      <stop offset="60%" stop-color="#14212e" />
      <stop offset="100%" stop-color="#0a111a" />
    </radialGradient>
    
    <!-- Gold Gradient for metallic look -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe699" />
      <stop offset="30%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#aa7c11" />
      <stop offset="100%" stop-color="#f3e5ab" />
    </linearGradient>

    <!-- Metallic Gold Light Gradient -->
    <linearGradient id="goldLightGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#5a450c" />
    </linearGradient>
    
    <!-- Deep Blue Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b3a54" />
      <stop offset="50%" stop-color="#1a2436" />
      <stop offset="100%" stop-color="#0e1420" />
    </linearGradient>

    <!-- Blue Arrow Gradient -->
    <linearGradient id="blueArrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1b2a47" />
      <stop offset="100%" stop-color="#415a77" />
    </linearGradient>

    <!-- Tablet Body Gradient -->
    <linearGradient id="tabletGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a4b5c" />
      <stop offset="100%" stop-color="#1b2430" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  
  <!-- Subtle Background Diagonal Grid Lines (recreating the textured background) -->
  <path d="M-50,150 L550,450 M-50,250 L550,550 M-50,50 L550,350 M100,-50 L600,250 M200,-50 L700,250" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1.5" />
  <path d="M550,150 L-50,450 M550,250 L-50,550 M550,50 L-50,350 M400,-50 L-100,250 M300,-50 L-200,250" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1.5" />

  <!-- MAIN EMBLEM GROUP (with Drop Shadow) -->
  <g filter="url(#dropShadow)" transform="translate(0, -10)">
    
    <!-- 1. Tilted Tablet/Screen Frame -->
    <g transform="rotate(-26, 256, 210) translate(0, 0)">
      <!-- Outer Rim (Gold & Dark Grey) -->
      <rect x="140" y="110" width="232" height="150" rx="20" fill="url(#tabletGrad)" stroke="url(#goldGrad)" stroke-width="4.5" />
      <!-- Inner Screen Area -->
      <rect x="148" y="118" width="216" height="134" rx="14" fill="#e0e6ed" stroke="#121a24" stroke-width="2" />
      
      <!-- Tablet Details (Camera or Button) -->
      <circle cx="158" cy="185" r="3.5" fill="url(#goldGrad)" />
      <!-- Decorative screen lines -->
      <path d="M 170 230 L 210 190 L 250 215 L 310 160" fill="none" stroke="#2b3a54" stroke-opacity="0.15" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- 2. The Upward Growth Arrows and Sprouting Leaves -->
    <!-- Blue/grey secondary arrow -->
    <path d="M 230 280 L 350 160 L 330 155 L 365 145 L 360 180 L 345 165 L 235 285 Z" fill="url(#blueArrowGrad)" stroke="url(#goldGrad)" stroke-width="1.5" />
    
    <!-- Golden main arrow -->
    <path d="M 210 270 L 335 125 L 315 120 L 350 108 L 345 145 L 330 130 L 215 275 Z" fill="url(#goldGrad)" filter="url(#glow)" />

    <!-- 3. Sprouting Leaves -->
    <!-- Left Leaf -->
    <path d="M 256 240 C 220 230, 180 180, 185 145 C 210 145, 245 180, 256 240 Z" fill="url(#leafGrad)" stroke="url(#goldGrad)" stroke-width="3" stroke-linejoin="round" />
    <!-- Left Leaf Center Vein -->
    <path d="M 256 240 C 240 210, 210 175, 185 145" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />

    <!-- Right Leaf -->
    <path d="M 256 240 C 285 220, 320 160, 305 130 C 280 135, 262 185, 256 240 Z" fill="url(#leafGrad)" stroke="url(#goldGrad)" stroke-width="3" stroke-linejoin="round" />
    <!-- Right Leaf Center Vein -->
    <path d="M 256 240 C 265 210, 285 170, 305 130" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />

    <!-- Middle Tall Leaf -->
    <path d="M 256 240 C 250 190, 230 110, 256 80 C 282 110, 262 190, 256 240 Z" fill="url(#leafGrad)" stroke="url(#goldGrad)" stroke-width="3" stroke-linejoin="round" />
    <!-- Middle Leaf Center Vein -->
    <path d="M 256 240 C 256 190, 256 125, 256 80" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />
  </g>

  <!-- 4. Underneath Calligraphy (نقلة NAQLA) -->
  <g transform="translate(256, 385)" filter="url(#dropShadow)">
    <path d="M -85,15 
             C -95,15 -105,10 -105,-5 
             C -105,-22 -90,-35 -70,-35 
             C -55,-35 -45,-25 -30,-25 
             C -15,-25 -10,-55 -2,-55 
             C 5,-55 10,-40 18,-40 
             C 25,-40 30,-50 42,-50 
             C 55,-50 65,-35 75,-35 
             C 85,-35 90,-45 98,-45
             C 104,-45 108,-40 108,-32
             C 108,-15 90,15 65,15
             C 45,15 35,0 20,0
             C 5,0 0,22 -20,22
             C -35,22 -45,10 -55,10
             C -65,10 -72,15 -85,15 Z
             M -72,-5
             C -68,-5 -62,-10 -62,-16
             C -62,-22 -68,-26 -74,-26
             C -82,-26 -88,-20 -88,-12
             C -88,-6 -80,-5 -72,-5 Z
             M 65,-5
             C 72,-5 78,-12 78,-18
             C 78,-24 72,-28 64,-28
             C 56,-28 50,-20 50,-12
             C 50,-6 58,-5 65,-5 Z" fill="url(#goldLightGrad)" />
             
    <!-- Calligraphy Dots -->
    <!-- Two dots above 'ق' -->
    <circle cx="15" cy="-62" r="7.5" fill="url(#goldGrad)" />
    <circle cx="35" cy="-62" r="7.5" fill="url(#goldGrad)" />
    
    <!-- One dot above 'ن' -->
    <circle cx="-70" cy="-52" r="7.5" fill="url(#goldGrad)" />
    
    <!-- Two dots above 'ة' -->
    <circle cx="82" cy="-57" r="6" fill="url(#goldGrad)" />
    <circle cx="98" cy="-57" r="6" fill="url(#goldGrad)" />
  </g>

  <!-- 5. English Subtitle: NAQLA -->
  <text x="256" y="450" font-family="'Inter', 'Space Grotesk', 'sans-serif'" font-weight="900" font-size="28" fill="url(#goldGrad)" letter-spacing="14" text-anchor="middle" opacity="0.95" filter="url(#glow)">NAQLA</text>

  <!-- Decorative Sparkle (bottom right) -->
  <g transform="translate(430, 430)">
    <path d="M 0,-15 Q 0,0 15,0 Q 0,0 0,15 Q 0,0 -15,0 Q 0,0 0,-15" fill="url(#goldGrad)" opacity="0.8" />
  </g>
</svg>
